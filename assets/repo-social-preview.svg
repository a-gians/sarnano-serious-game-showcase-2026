<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Sarnano Serious Game Showcase 2026</title>
  <desc id="desc">GitHub repository social preview for a student serious game showcase about circular economy and sustainable decisions.</desc>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f7f2e6" stop-opacity="0.96"/>
      <stop offset="0.48" stop-color="#f7f2e6" stop-opacity="0.88"/>
      <stop offset="0.78" stop-color="#f7f2e6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f7f2e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#151713" stop-opacity="0"/>
      <stop offset="1" stop-color="#151713" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#184f35" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#f7f2e6"/>
  <image href="repo-social-preview-base.png" x="0" y="0" width="1280" height="640" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1280" height="640" fill="url(#wash)"/>
  <rect width="1280" height="640" fill="url(#bottomShade)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <g transform="translate(76 70)">
    <rect x="-18" y="-18" width="118" height="6" fill="#e6b642"/>
    <text x="0" y="26"
          font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
          font-size="22"
          font-weight="800"
          letter-spacing="2.4"
          fill="#b74f35">WORKSHOP SAPER(E)CONSUMARE</text>

    <text x="0" y="148"
          font-family="Georgia, New York, Times New Roman, serif"
          font-size="78"
          font-weight="800"
          letter-spacing="0"
          fill="#151713">
      <tspan x="0" dy="0">Sarnano</tspan>
      <tspan x="0" dy="76">Serious Game</tspan>
      <tspan x="0" dy="76">Showcase 2026</tspan>
    </text>

    <text x="2" y="410"
          font-family="Avenir Next, Helvetica Neue, Arial, sans-serif"
          font-size="25"
          font-weight="650"
          letter-spacing="0"
          fill="#184f35">
      <tspan x="2" dy="0">Prototipi web degli studenti su economia circolare,</tspan>
      <tspan x="2" dy="36">decisioni d'impresa e sostenibilita.</tspan>
    </text>

    <g transform="translate(0 474)" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1.1">
      <rect x="0" y="-30" width="170" height="44" rx="22" fill="#184f35"/>
      <text x="22" y="-2" fill="#f7f2e6">GitHub repo</text>
      <rect x="190" y="-30" width="134" height="44" rx="22" fill="#e6b642"/>
      <text x="212" y="-2" fill="#151713">Liceo</text>
      <rect x="344" y="-30" width="156" height="44" rx="22" fill="#76aec1"/>
      <text x="366" y="-2" fill="#151713">Sarnano</text>
    </g>
  </g>
</svg>
